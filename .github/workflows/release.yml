# Releases on every push to main whose root package.json carries a version that
# has no tag yet. Bump the version in a PR; merging it ships the release.
#
# A push that does not change the version exits quietly rather than failing —
# most merges are not releases, and a red run on each of them trains everyone
# to ignore the badge.
#
# This workflow never writes to main: it verifies the committed dist matches
# its sources, then tags. There is no publish step either, since the package is
# private and installs straight from git on both sides — the tag is the
# release. Composer resolves it through its VCS repository; npm reads the same
# tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the dist commit, the tag, and the release

# A second run tagging the same commit would race the first; queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CORE_REF: main

jobs:
  release:
    name: Tag both halves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - uses: actions/checkout@v4
        with:
          repository: DiVotek/tbtop
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}
          path: tbtop

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Read version
        id: ver
        working-directory: package
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "resolved version $v"

      # Not an error: most pushes to main do not bump the version.
      - name: Is this version already released?
        id: gate
        working-directory: package
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists — nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is free — releasing"
          fi

      - name: Build core client
        if: steps.gate.outputs.release == 'true'
        working-directory: tbtop/packages/client
        run: bun install --frozen-lockfile && bun run build

      - name: Rebuild dist
        if: steps.gate.outputs.release == 'true'
        working-directory: package/client
        run: bun install && bun run build

      # Consumers install the tagged checkout as-is, so a stale dist would ship
      # code that does not match its sources. CI enforces this on every PR; if
      # it is wrong here, the fix is a commit on main, not a push from this run
      # (which branch protection would reject anyway).
      - name: Committed dist matches the sources
        if: steps.gate.outputs.release == 'true'
        working-directory: package
        run: |
          if ! git diff --exit-code -- client/dist; then
            echo "::error::client/dist is stale — rebuild and commit it before releasing"
            exit 1
          fi

      - name: Create and push tag
        if: steps.gate.outputs.release == 'true'
        working-directory: package
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
